name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train model
        run: |
          python -m src.train

      - name: Run tests
        run: |
          python -m pytest

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run mypy
        run: |
          mypy src